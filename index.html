<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Page - DFE1</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/tenis.png" type="image/x-icon">
</head>
<header>
    <div id="headerContent">
        <div>
            <img src="assets/white-logo.png" alt="logo do site">
        </div>
        <nav>
            <ul>
                <li><a href="#">Esporte</a></li>
                <li><a href="#">Casual</a></li>
                <li><a href="#">Social</a></li>
            </ul>
        </nav>
        <div id="iconsHeader">
            <img src="./assets/lupa.png" alt="carrinho de compras">
            <img src="./assets/cart.png" alt="carrinho de compras">
            <img src="assets/account.png" alt="conta usuario">
        </div>
    </div>
</header>
<body>
    <div id="containerBody">
        <div id="carrossel">
            <img src="assets/luka.jpg" alt="pessoa correndo">
        </div>

        <div id="grid">
            <div class="cardTenis">
                <img src="assets/tenisNike.png" alt="Giannis 3 Imortality">
                <h1>ESPORTE</h1>
            </div>
            <div class="cardTenis">
                <img src="assets/adidas.png" alt="Tênis casual">
                <h1>CASUAL</h1>
            </div>
            <div class="cardTenis">
                <img src="assets/puma.png" alt="Tênis social">
                <h1>SOCIAL</h1>
            </div>
        </div>
        <div id="footer">
            
        </div>
    </div>
</body>
</html>
