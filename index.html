<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Page - DFE1</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/tenis.png" type="image/x-icon">
</head>
<header>
    <div id="headerContent">
        <div>
            <img src="assets/icons/white-logo.png" alt="logo do site">
        </div>
        <nav>
            <ul>
                <li><a href="pages/esporte.html">Esporte</a></li>
                <li><a href="pages/casual.html">Casual</a></li>
                <li><a href="pages/social.html">Social</a></li>
            </ul>
        </nav>
        <div id="iconsHeader">
            <img src="./assets/icons/lupa.png" alt="carrinho de compras">
            <img src="./assets/icons/cart.png" alt="carrinho de compras">
            <img src="assets/icons/account.png" alt="conta usuario">
        </div>
    </div>
</header>
<body onload="iniciarTudo()">
    <div id="containerBody">
        <div id="carrossel">
            <img id="imgCarrossel" src="assets/images/puma.jpg" alt="Carrossel de fotos">
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>            
        </div>

        <div id="grid">
            <div class="cardTenis">
                <img src="assets/images/running.png" alt="Giannis 3 Imortality">
                <h1>Loja Corrida</h1>
            </div>
            <div class="cardTenis">
                <img src="assets/images/social.png" alt="Tênis social">
                <h1>Loja Social</h1>
            </div>
            <div class="cardTenis">
                <img src="assets/images/volei.png" alt="Tênis casual">
                <h1>Loja Esporte</h1>
            </div>
        </div>
        <div id="footer">
        </div>
    </div>
</body>
</html>
